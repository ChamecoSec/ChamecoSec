<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" role="img" aria-label="Divisor decorativo">
  <style>
    :root{--line:#3f8f5a;--bud:#e58aa3;--spark:#e0a526}
    @media (prefers-color-scheme: dark){:root{--line:#7fe0a8;--bud:#ffb3c7;--spark:#ffd36e}}
    .line{stroke:var(--line);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 4s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .bud{fill:var(--bud);transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    .spark{fill:var(--spark);animation:tw 2.4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    .leaf{fill:var(--line);opacity:.85}
  </style>
  <path class="line" d="M40 32 C130 8 210 56 300 32 S400 14 430 30"/>
  <path class="line" d="M860 32 C770 8 690 56 600 32 S500 14 470 30"/>
  <ellipse class="leaf" cx="150" cy="24" rx="9" ry="4" transform="rotate(-25 150 24)"/>
  <ellipse class="leaf" cx="250" cy="42" rx="9" ry="4" transform="rotate(25 250 42)"/>
  <ellipse class="leaf" cx="750" cy="24" rx="9" ry="4" transform="rotate(25 750 24)"/>
  <ellipse class="leaf" cx="650" cy="42" rx="9" ry="4" transform="rotate(-25 650 42)"/>
  <circle class="bud" cx="450" cy="30" r="7"/>
  <g class="spark">
    <circle cx="320" cy="14" r="2"/>
    <circle cx="580" cy="48" r="2" style="animation-delay:.8s"/>
    <circle cx="110" cy="44" r="1.6" style="animation-delay:1.4s"/>
    <circle cx="800" cy="14" r="1.6" style="animation-delay:.4s"/>
  </g>
</svg>
